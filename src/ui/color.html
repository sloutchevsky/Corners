<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash background</title><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="color.css"></head><body>
<header><span>Background color</span><button id="close" aria-label="Close color picker">×</button></header>
<canvas id="color-wheel" width="240" height="240" tabindex="0" role="img" aria-label="Color wheel. Arrow keys change hue and saturation."></canvas>
<div class="brightness"><label for="brightness">Brightness</label><input id="brightness" type="range" min="0" max="100" value="100"></div>
<div class="color-value"><span id="color-preview"></span><input id="color-hex" aria-label="Hex background color" maxlength="7" spellcheck="false" value="#ffffff"><button id="color-pick" title="Pick a color from the screen" aria-label="Pick a color from the screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6m-9-3 3-3a3 3 0 0 1 4 4l-3 3M13 6l5 5M5 16l8-8 3 3-8 8-4 1z"/></svg></button><button data-color="#ffffff" aria-label="White background">White</button><button data-color="#000000" aria-label="Black background">Black</button></div>
<p id="color-status" aria-live="polite">Changing color reloads Flash.</p>
<script src="color.js"></script></body></html>
