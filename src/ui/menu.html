<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corners menu</title><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="menu.css"><link rel="stylesheet" href="inline-icons.css"></head><body>
<div class="menu-surface"><nav class="browser-menu" aria-label="Browser menu">
  <button data-action="new-tab"><span>New tab</span><kbd>Ctrl+T</kbd></button>
  <button data-action="new-flashcognito"><span>New Flashcognito tab</span><kbd>Ctrl+Shift+N</kbd></button>
  <button data-action="open-file"><span>Open file…</span><kbd>Ctrl+O</kbd></button>
  <hr>
  <button data-panel="library"><span>Flash Gallery</span></button>
  <button data-panel="bookmarks"><span>Bookmarks</span></button>
  <button data-panel="history"><span>History</span><kbd>Ctrl+H</kbd></button>
  <button data-panel="downloads"><span>Downloads</span><kbd>Ctrl+J</kbd></button>
  <hr>
  <button data-action="print"><span>Print…</span><kbd>Ctrl+P</kbd></button>
  <button data-action="menu-find"><span>Find in page</span><kbd>Ctrl+F</kbd></button>
  <hr>
  <div class="menu-control-row"><span>Zoom</span><div class="zoom-buttons"><button id="zoom-out" data-zoom="-1" aria-label="Zoom out">−</button><button id="zoom-reset" data-zoom="0" aria-label="Reset zoom to 100%">100%</button><button id="zoom-in" data-zoom="1" aria-label="Zoom in">+</button></div><button class="fullscreen-button" data-action="fullscreen" aria-label="Toggle full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></div>
  <div class="menu-control-row"><span>Flash quality</span><div class="quality-buttons" role="group" aria-label="Flash quality"><button data-quality="low" aria-pressed="false">Low</button><button data-quality="medium" aria-pressed="false">Medium</button><button data-quality="high" aria-pressed="true">High</button></div></div>
  <button id="menu-native" data-action="native-mode" aria-pressed="false"><span>Native Adobe Flash mode</span><span class="checked" aria-hidden="true">✓</span></button>
  <button id="menu-mute" data-action="mute"><span>Mute tab</span></button>
  <hr>
  <button data-panel="extensions"><span>Extensions</span></button>
  <button data-panel="settings" data-section="privacy"><span>Delete browsing data...</span></button>
  <button data-panel="settings"><span>Settings</span></button>
  <button data-panel="about"><span>About</span></button>
  <button data-panel="support"><span>Support Corners</span></button>
</nav>
<div id="menu-error" role="status"></div></div>
<script src="menu.js"></script></body></html>
