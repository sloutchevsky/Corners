<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><meta name="description" content="A gallery of Flash websites by Firstborn and Freedom + Partners.">
  <title>Flash Gallery</title>
  <link rel="canonical" href="https://flashborn.sloutchevsky.com/flash.gallery.html">
  <style>/* LIBRARY_STYLE */</style>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 15 16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L9 20l-6 1Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  </defs></svg>
  <main class="library-page">
    <h1>Flash <span class="gallery-word">Gallery<canvas id="gallery-bolt" class="gallery-bolt" width="144" height="144" aria-hidden="true"></canvas></span></h1>
    <p class="description">Your Flash websites and HTML pages, from local files or the web.</p>
    <div class="library-actions">
      <button id="add-page" class="primary"><svg class="icon"><use href="#i-plus"/></svg>Add a Flash page</button>
    </div>
    <figure class="featured-work">
      <div id="feature-stage" class="feature-stage" aria-label="Featured Flash website"></div>
      <figcaption><a id="feature-caption-link" class="feature-caption-link" target="_blank" rel="noopener"><h2 id="feature-title"></h2><p id="feature-credit"></p></a></figcaption>
    </figure>
    <div class="collection-search"><input id="filter" class="pill" type="search" placeholder="Find in gallery" aria-label="Find in gallery" autocomplete="off"></div>
    <p id="introduction" class="introduction"><button id="edit-introduction" title="Edit introduction"></button></p>
    <section id="cards" class="cards" aria-label="Flash websites"></section>
    <p id="empty" class="empty" hidden>No matching pages. Try another search.</p>
  </main>
  <dialog id="page-editor" aria-labelledby="editor-title">
    <form id="page-form">
      <div class="dialog-heading"><h2 id="editor-title">Add a Flash page</h2><button type="button" class="icon-button" data-close-editor aria-label="Close editor"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <label>Title<input name="title" maxlength="300" required autocomplete="off"></label>
      <div class="credit-fields"><label>Created by<input name="createdBy" maxlength="300" placeholder="Firstborn"></label><label>Year<input name="year" maxlength="40" placeholder="2006"></label></div>
      <label>Website or local HTML file<input name="source" required maxlength="8192" placeholder="https://example.com/" spellcheck="false" autocomplete="off"></label>
      <label>Description<textarea name="description" rows="3" maxlength="4000"></textarea></label>
      <div class="dialog-actions"><button type="button" class="secondary" id="browse-page" hidden>Browse…</button><button type="button" class="secondary" id="change-page-image" hidden>Change image</button><span></span><button type="button" class="secondary" data-close-editor>Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>
  <dialog id="introduction-editor" aria-labelledby="introduction-title"><form id="introduction-form"><h2 id="introduction-title">Edit introduction</h2><label>Introduction<textarea name="introduction" rows="5" maxlength="600" required></textarea></label><div class="dialog-actions"><span></span><button type="button" class="secondary" id="cancel-introduction">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
  <input id="image-picker" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <div id="reorder-line" hidden aria-hidden="true"></div>
  <p id="notice" class="notice" role="status" hidden></p>
  <script id="library-data" type="application/json">/* LIBRARY_DATA */</script>
  <script>/* DRAG_PREVIEW */</script>
  <script>/* GALLERY_LIGHTNING */</script>
  <script>/* GALLERY_BOLT */</script>
  <script>/* LIBRARY_SCRIPT */</script>
</body>
</html>
