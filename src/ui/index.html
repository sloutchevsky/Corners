<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashborn</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="themes.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="nav-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94621b"/><stop offset=".38" stop-color="#d6aa4e"/><stop offset=".53" stop-color="#f5e1a2"/><stop offset=".7" stop-color="#c29435"/><stop offset="1" stop-color="#916020"/></linearGradient>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 7v5h-5M19.5 12a7.5 7.5 0 1 0-2 5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><image href="brand/bolt.png" width="24" height="24"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1 6.2-5.6-3-5.6 3 1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 4v5h5M3.8 9a8.5 8.5 0 1 1 .5 7M12 7v5l3 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.5 3h5l.6 2.6 2.1 1.2 2.6-.8 2.5 4.3-2 1.8v2.4l2 1.8-2.5 4.3-2.6-.8-2.1 1.2-.6 2.6h-5l-.6-2.6-2.1-1.2-2.6.8L1.8 16l2-1.8v-2.4l-2-1.8L4.3 5.7l2.6.8L9 5.3z" transform="translate(0 -1) scale(1 .95)"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V4h7l2 3h9v13H3z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" stroke="none"/></symbol>
  </defs></svg>
  <header class="titlebar">
    <span class="title-brand"><canvas id="title-bolt" width="96" height="96" role="img" aria-label="Flashborn lightning bolt"></canvas></span>
    <span class="title-note">A quieter kind of browsing</span>
    <div class="window-controls">
      <button data-action="minimize" title="Minimize" aria-label="Minimize"><svg class="icon"><use href="#i-minimize"/></svg></button>
      <button data-action="maximize" title="Maximize" aria-label="Maximize"><svg class="icon"><use href="#i-maximize"/></svg></button>
      <button data-action="close-window" class="window-close" title="Close" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <aside class="sidebar">
    <div class="sidebar-top"><button class="icon-button" data-action="collapse" title="Toggle sidebar" aria-label="Toggle sidebar"><svg class="icon"><use href="#i-sidebar"/></svg></button><button class="sidebar-wordmark brand-wordmark" data-panel="about" title="About" aria-label="flashborn — About"></button></div>
    <button class="new-tab nav-button" data-action="new-tab" title="New tab (Ctrl+T)"><svg class="icon"><use href="#i-plus"/></svg><span>New tab</span><kbd>Ctrl T</kbd></button>
    <div class="tabs-label"><span>Your tabs</span><span id="tab-count"></span></div>
    <div id="tabs" class="tabs" aria-label="Open tabs"></div>
    <div class="sidebar-bottom">
      <button class="nav-button" data-panel="library" title="Flash library"><canvas class="nav-gold nav-gold-library" data-nav-icon="library" width="128" height="128" aria-hidden="true"></canvas><span>Flash library</span><span class="pill">SWF</span></button>
      <button class="nav-button" data-panel="bookmarks" title="Bookmarks"><canvas class="nav-gold nav-gold-bookmarks" data-nav-icon="bookmarks" width="128" height="128" aria-hidden="true"></canvas><span>Bookmarks</span></button>
      <button class="nav-button" data-panel="history" title="History (Ctrl+H)"><canvas class="nav-gold nav-gold-history" data-nav-icon="history" width="128" height="128" aria-hidden="true"></canvas><span>History</span></button>
      <button class="nav-button" data-panel="downloads" title="Downloads (Ctrl+J)"><canvas class="nav-gold nav-gold-downloads" data-nav-icon="downloads" width="128" height="128" aria-hidden="true"></canvas><span>Downloads</span><span id="download-count" class="count"></span><span id="download-new" class="download-badge hidden" aria-label="New completed downloads">NEW</span></button>
      <div class="sidebar-rule"></div>
      <button class="nav-button" data-panel="settings" title="Settings"><canvas class="nav-gold nav-gold-settings" data-nav-icon="settings" width="128" height="128" aria-hidden="true"></canvas><span>Settings</span></button>
    </div>
  </aside>
  <nav class="toolbar" aria-label="Navigation">
    <div class="nav-controls">
      <button id="back" class="icon-button" data-action="back" title="Back (Alt+Left)" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
      <button id="forward" class="icon-button" data-action="forward" title="Forward (Alt+Right)" aria-label="Forward"><svg class="icon"><use href="#i-forward"/></svg></button>
      <button id="reload" class="icon-button" data-action="reload" title="Reload (Ctrl+R)" aria-label="Reload"><svg class="icon"><use href="#i-reload"/></svg></button>
    </div>
    <form id="address-form" class="address"><svg id="address-icon" class="icon"><use href="#i-search"/></svg><input id="address" spellcheck="false" autocomplete="off" aria-label="Search or enter address" placeholder="Search or enter an address"><button id="address-go" type="submit" class="icon-button" title="Go to address" aria-label="Go to address"><svg class="icon"><use href="#i-forward"/></svg></button><button id="bookmark" type="button" class="icon-button" data-action="bookmark" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"><svg class="icon"><use href="#i-star"/></svg></button></form>
    <span id="private-badge" class="private-badge hidden" title="Flashcognito: this tab uses a temporary session"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Flashcognito</span>
    <button id="native-mode" type="button" class="icon-button native-bolt-button" data-action="native-mode" title="Switch this page to native Adobe Flash" aria-label="Toggle native Adobe Flash mode"><canvas id="loading-bolt" class="loading-bolt" width="96" height="96" aria-hidden="true"></canvas></button>
    <button id="theme-button" class="icon-button" data-action="theme" title="Change theme" aria-label="Change theme"><svg id="theme-icon" class="icon"><use href="#i-theme"/></svg></button>
    <button id="menu-button" class="icon-button" title="Browser menu" aria-label="Browser menu"><svg class="icon"><use href="#i-more"/></svg></button>
    <form id="find-form" class="find hidden"><input id="find-input" placeholder="Find in page" aria-label="Find in page"><small id="find-count"></small><button type="button" id="find-prev" aria-label="Previous match">↑</button><button type="submit" aria-label="Next match">↓</button><button type="button" id="find-close" aria-label="Close find">×</button></form>
  </nav>
  <main id="content" class="content"></main>
  <img id="color-pick-preview" class="color-pick-preview hidden" alt="" aria-hidden="true">
  <footer class="statusbar"><span id="page-status">Make yourself at home.</span><span id="status-right">Chromium · Adobe Flash</span></footer>
  <div id="toast" role="status" class="toast hidden"></div>
  <script src="lightning.js"></script><script src="navigation-icons.js"></script><script src="app.js"></script>
</body>
</html>
