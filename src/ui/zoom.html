<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page zoom</title><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="zoom.css"><link rel="stylesheet" href="inline-icons.css"></head><body>
<div class="zoom-popup" role="group" aria-label="Page zoom"><button data-zoom="-1" id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-level" aria-live="polite">100%</output><button data-zoom="1" id="zoom-in" aria-label="Zoom in">+</button><button data-zoom="0" class="reset" aria-label="Reset zoom to 100%">Reset</button></div>
<script src="zoom.js"></script></body></html>
