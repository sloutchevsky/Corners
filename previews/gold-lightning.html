<div id="flashborn-gold-preview" class="viz-dotted-background">
  <div class="fb-preview" aria-label="Flashborn gold lightning preview">
    <div class="fb-toolbar" aria-label="Browser toolbar preview">
      <span class="fb-navigation" aria-hidden="true"><i data-lucide="arrow-left"></i></span>
      <div class="fb-address">
        <i data-lucide="lock-keyhole" aria-hidden="true"></i>
        <input aria-label="Preview URL" value="flashborn://preview" readonly>
      </div>
      <button type="button" class="fb-bolt-button cursor-interaction" aria-label="Finish loading" data-loading-toggle>
        <canvas class="fb-bolt-small" width="96" height="96" aria-hidden="true"></canvas>
      </button>
      <span class="fb-more" aria-hidden="true"><i data-lucide="ellipsis"></i></span>
    </div>
    <div class="fb-icon-stage">
      <canvas class="fb-bolt-large" width="528" height="528" role="img" aria-label="A beveled gold lightning bolt spinning in 3D around its vertical axis"></canvas>
    </div>
    <div class="fb-controls">
      <span class="fb-status" role="status" aria-live="polite">Loading…</span>
      <button type="button" class="fb-state-button cursor-interaction" aria-pressed="true" data-loading-toggle>Finish loading</button>
    </div>
  </div>
</div>
<style>
  #flashborn-gold-preview { padding: 28px 0; }
  #flashborn-gold-preview .fb-preview {
    --fb-bg: #212121; --fb-text: #ececec; --fb-muted: #a4a4a4;
    --fb-field: #2c2c2c; --fb-border: #383838; --fb-hover: #343434;
    color-scheme: dark; color: var(--fb-text); background: var(--fb-bg);
    font: 14px/1.5 "Segoe UI", Arial, sans-serif;
    border-radius: 16px; overflow: hidden; max-width: 720px; margin: 0 auto;
  }
  #flashborn-gold-preview .fb-preview * { box-sizing: border-box; }
  #flashborn-gold-preview .fb-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 18px 20px;
    border-bottom: 1px solid #2b2b2b;
  }
  #flashborn-gold-preview .fb-navigation,
  #flashborn-gold-preview .fb-more {
    display: grid; place-items: center; width: 24px; flex: none; color: var(--fb-muted);
  }
  #flashborn-gold-preview .fb-toolbar svg { width: 17px; height: 17px; }
  #flashborn-gold-preview .fb-address {
    display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;
    height: 38px; padding: 0 12px; border-radius: 11px;
    background: var(--fb-field); border: 1px solid var(--fb-border);
  }
  #flashborn-gold-preview .fb-address > svg { width: 14px; height: 14px; flex: none; color: var(--fb-muted); }
  #flashborn-gold-preview .fb-address input {
    background: transparent; border: 0; min-width: 0; width: 100%;
    color: #c7c7c7; font: 12px "Segoe UI", Arial, sans-serif; padding: 0;
  }
  #flashborn-gold-preview .fb-bolt-button {
    width: 34px; height: 34px; padding: 0; flex: none; display: grid;
    place-items: center; background: transparent; border: 0; border-radius: 9px;
  }
  #flashborn-gold-preview .fb-bolt-button:hover { background: var(--fb-hover); }
  #flashborn-gold-preview .fb-bolt-small { display: block; width: 32px; height: 32px; }
  #flashborn-gold-preview .fb-icon-stage {
    display: grid; place-items: center; padding: 30px 0 12px;
    background: radial-gradient(ellipse at 50% 48%, #ffd45609 0%, transparent 55%);
  }
  #flashborn-gold-preview .fb-bolt-large { display: block; width: 176px; height: 176px; }
  #flashborn-gold-preview .fb-controls {
    display: flex; align-items: center; justify-content: center; gap: 22px; padding: 16px 20px 28px;
  }
  #flashborn-gold-preview .fb-status { min-width: 68px; color: var(--fb-muted); font-size: 12px; }
  #flashborn-gold-preview .fb-state-button {
    color: var(--fb-text); background: #2c2c2c; border: 1px solid #454545;
    border-radius: 8px; padding: 8px 13px; font: 12px "Segoe UI", Arial, sans-serif;
  }
  #flashborn-gold-preview .fb-state-button:hover { background: var(--fb-hover); }
  @media (max-width: 420px) {
    #flashborn-gold-preview .fb-toolbar { padding-inline: 12px; gap: 6px; }
    #flashborn-gold-preview .fb-navigation { display: none; }
  }
  @media (pointer: coarse) {
    #flashborn-gold-preview .fb-bolt-button { width: 44px; height: 44px; }
    #flashborn-gold-preview .fb-state-button { min-height: 44px; }
    #flashborn-gold-preview .fb-address input { font-size: 16px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('flashborn-gold-preview');
  if (root.dataset.initialized) return;
  root.dataset.initialized = 'true';
  const canvases = Array.from(root.querySelectorAll('canvas'));
  const status = root.querySelector('.fb-status');
  const toggleButtons = Array.from(root.querySelectorAll('[data-loading-toggle]'));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const saved = window.openai?.widgetState;
  const state = { loading: saved?.modelContent?.loading ?? true, period: 2.0, depth: 10 };
  const TAU = Math.PI * 2;
  // Model-space polygon, an extruded solid with separate beveled faces.
  const outline = [[9, 50], [-32, -5], [-3, -5], [-11, -50], [33, 11], [5, 11]];
  const normalize = v => {
    const length = Math.hypot(...v) || 1;
    return v.map(x => x / length);
  };
  const dot = (a, b) => a.reduce((sum, x, i) => sum + x * b[i], 0);
  const subtract = (a, b) => a.map((x, i) => x - b[i]);
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const pointAt = (p, z) => [p[0], p[1], z];
  function insetPolygon(points, distance) {
    return points.map((point, i) => {
      const previous = points[(i + points.length - 1) % points.length];
      const next = points[(i + 1) % points.length];
      const a = normalize(subtract(point, previous));
      const b = normalize(subtract(next, point));
      const n1 = [-a[1], a[0]], n2 = [-b[1], b[0]];
      const bisector = normalize([n1[0] + n2[0], n1[1] + n2[1]]);
      const length = distance / Math.max(0.15, dot(bisector, n1));
      return [point[0] + bisector[0] * length, point[1] + bisector[1] * length];
    });
  }
  function buildMesh() {
    const half = state.depth / 2, bevel = 1.8, shoulder = half - bevel;
    const inner = insetPolygon(outline, bevel);
    const mesh = [
      { points: inner.map(p => pointAt(p, half)), kind: 'face' },
      { points: inner.map(p => pointAt(p, -half)).reverse(), kind: 'face' }
    ];
    outline.forEach((p, i) => {
      const j = (i + 1) % outline.length, next = outline[j];
      mesh.push({ kind: 'bevel', points: [pointAt(p, shoulder), pointAt(next, shoulder), pointAt(inner[j], half), pointAt(inner[i], half)] });
      mesh.push({ kind: 'side', points: [pointAt(p, -shoulder), pointAt(next, -shoulder), pointAt(next, shoulder), pointAt(p, shoulder)] });
      mesh.push({ kind: 'bevel', points: [pointAt(next, -shoulder), pointAt(p, -shoulder), pointAt(inner[i], -half), pointAt(inner[j], -half)] });
    });
    return mesh;
  }
  let mesh = buildMesh();
  let angle = 0, frameId = 0, lastTime = 0, settling = null;
  const light = normalize([-0.45, 0.65, 1]);
  const halfVector = normalize([light[0], light[1], light[2] + 1]);
  const rotate = (p, a) => [p[0]*Math.cos(a)+p[2]*Math.sin(a), p[1], -p[0]*Math.sin(a)+p[2]*Math.cos(a)];
  const metalColor = (rgb, brightness) => `rgb(${rgb.map(c => Math.round(Math.min(255, c * brightness))).join(',')})`;
  function draw(a) {
    const faces = mesh.map(face => {
      const points = face.points.map(p => rotate(p, a));
      const normal = normalize(cross(subtract(points[1], points[0]), subtract(points[2], points[0])));
      return { ...face, points, normal, z: points.reduce((sum, p) => sum + p[2], 0) / points.length };
    }).filter(face => face.normal[2] > 0.001).sort((a, b) => a.z - b.z);
    canvases.forEach(canvas => {
      const ctx = canvas.getContext('2d');
      const size = canvas.width, scale = size * 0.00665;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(size / 2, size / 2);
      ctx.scale(scale, -scale);
      faces.forEach(face => {
        const points = face.points.map(p => {
          const perspective = 400 / (400 - p[2]);
          return [p[0] * perspective, p[1] * perspective];
        });
        const illumination = Math.max(0, dot(face.normal, light));
        const specular = Math.pow(Math.max(0, dot(face.normal, halfVector)), 22);
        const brightness = 0.63 + 0.36 * illumination + 0.22 * specular;
        const reflection = 0.48 + 0.25 * Math.sin(a * 2 + face.normal[0] * 1.5);
        const gradient = ctx.createLinearGradient(-53, 60, 53, -60);
        gradient.addColorStop(0, metalColor([171, 94, 9], brightness));
        gradient.addColorStop(reflection - 0.19, metalColor([241, 175, 37], brightness));
        gradient.addColorStop(reflection, metalColor([255, 237, 168], brightness + 0.08));
        gradient.addColorStop(reflection + 0.085, metalColor([241, 185, 49], brightness));
        gradient.addColorStop(1, metalColor([174, 102, 12], brightness));
        ctx.beginPath();
        points.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p));
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
        // A hairline closes antialiasing seams between adjoining metal facets.
        ctx.lineWidth = 0.38;
        ctx.strokeStyle = gradient;
        ctx.stroke();
      });
      ctx.restore();
      canvas.dataset.angle = a.toFixed(4);
    });
  }
  function animate(now) {
    frameId = 0;
    const elapsed = lastTime ? Math.min(64, now - lastTime) : 0;
    lastTime = now;
    if (state.loading && !reducedMotion.matches) {
      angle = (angle + elapsed * TAU / (state.period * 1000)) % TAU;
    } else if (settling) {
      const progress = Math.min(1, (now - settling.start) / 420);
      const eased = 1 - Math.pow(1 - progress, 3);
      angle = settling.from + (settling.to - settling.from) * eased;
      if (progress === 1) { angle = 0; settling = null; }
    }
    draw(angle);
    if ((state.loading && !reducedMotion.matches) || settling) frameId = requestAnimationFrame(animate);
    else lastTime = 0;
  }
  function startFrame() {
    if (!frameId) { lastTime = 0; frameId = requestAnimationFrame(animate); }
  }
  function render() {
    status.textContent = state.loading ? 'Loading…' : 'Ready';
    root.dataset.loading = String(state.loading);
    toggleButtons.forEach(button => {
      button.setAttribute('aria-pressed', String(state.loading));
      button.setAttribute('aria-label', state.loading ? 'Finish loading' : 'Start loading');
      if (button.classList.contains('fb-state-button')) button.textContent = state.loading ? 'Finish loading' : 'Start loading';
    });
    mesh = buildMesh();
    if (state.loading) settling = null;
    else if (Math.abs(angle) > 0.001 && !settling && !reducedMotion.matches) {
      settling = { from: angle, to: Math.round(angle / TAU) * TAU, start: performance.now() };
    }
    if (reducedMotion.matches) { angle = 0; settling = null; }
    draw(angle);
    startFrame();
  }
  toggleButtons.forEach(button => button.addEventListener('click', () => {
    state.loading = !state.loading;
    render();
    window.openai?.setWidgetState?.({ modelContent: { loading: state.loading }, privateContent: null }).catch(() => {});
  }));
  reducedMotion.addEventListener('change', render);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frameId); frameId = 0; lastTime = 0; }
    else render();
  });
  window.addEventListener('openai:set_globals', event => {
    const loading = event.detail?.globals?.widgetState?.modelContent?.loading;
    if (typeof loading === 'boolean') { state.loading = loading; render(); }
  });
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector('.fb-preview'), onChange: render });
    tweak.addSlider(state, 'period', { min: 1.2, max: 3.5, step: 0.1, unit: 's', label: 'Seconds per spin' });
    tweak.addSlider(state, 'depth', { min: 5, max: 14, step: 1, label: 'Bolt thickness' });
  }
})();
</script>
